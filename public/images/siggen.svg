<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
  <defs>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(148,163,184,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="600" fill="#0b0e12"/>
  <!-- Topbar -->
  <rect width="960" height="48" fill="#0e1217"/>
  <line x1="0" y1="48" x2="960" y2="48" stroke="#232a35" stroke-width="1"/>
  <path d="M22 24 C27 14, 32 14, 37 24 C42 34, 47 34, 52 24" fill="none" stroke="#fb7185" stroke-width="2.6" stroke-linecap="round"/>
  <text x="66" y="29" fill="#e8edf2" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600">HotWire Signal Generator</text>
  <rect x="786" y="12" width="154" height="24" rx="4" fill="rgba(251,113,133,0.18)" stroke="#fb7185" stroke-width="1"/>
  <circle cx="804" cy="24" r="4" fill="#fb7185"/>
  <text x="818" y="28" fill="#fecdd3" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="700">OUTPUT ON</text>

  <!-- Waveform preview box -->
  <rect x="24" y="68" width="912" height="250" rx="6" fill="#060a10" stroke="#232a35" stroke-width="1.2"/>
  <rect x="76" y="96" width="840" height="192" fill="url(#g)" stroke="#232a35" stroke-width="1"/>
  <line x1="76" y1="192" x2="916" y2="192" stroke="rgba(148,163,184,0.18)" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Y labels -->
  <text x="34" y="102" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">3.3V</text>
  <text x="30" y="196" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">1.65V</text>
  <text x="34" y="288" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">0.0V</text>
  <!-- HUD -->
  <text x="78" y="88" fill="#fb7185" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">CH1(D0): Sine 1.00 kHz [DDS]</text>
  <text x="690" y="88" fill="#38bdf8" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="600">CH2(D1): Square 1.00 kHz [LEDC]</text>
  <!-- CH2 Square -->
  <path d="M 76 268 L 146 268 L 146 116 L 286 116 L 286 268 L 426 268 L 426 116 L 566 116 L 566 268 L 706 268 L 706 116 L 846 116 L 846 268 L 916 268" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.72"/>
  <!-- CH1 Sine -->
  <path d="M 76 192 C 146 84, 216 84, 286 192 C 356 300, 426 300, 496 192 C 566 84, 636 84, 706 192 C 776 300, 846 300, 916 192" fill="none" stroke="#fb7185" stroke-width="3"/>

  <!-- Control cards -->
  <rect x="24" y="340" width="446" height="236" rx="6" fill="#11151b" stroke="#232a35" stroke-width="1.2"/>
  <rect x="40" y="358" width="4" height="16" rx="2" fill="#fb7185"/>
  <text x="54" y="371" fill="#e8edf2" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600">CH1 · D0 (PWM-DAC DDS)</text>
  <text x="40" y="406" fill="#b8c1cc" font-family="IBM Plex Mono, monospace" font-size="12">Wave: Sine · Freq: 1000 Hz · 3.00 Vpp · 1.65 V</text>
  <rect x="40" y="428" width="414" height="8" rx="4" fill="#171d26"/>
  <rect x="40" y="428" width="320" height="8" rx="4" fill="#fb7185"/>
  <text x="40" y="468" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11.5">Sweep: Linear / Log (100 Hz → 2000 Hz)</text>
  <text x="40" y="498" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11.5">Direct LEDC Square / PWM up to 20 MHz</text>

  <rect x="490" y="340" width="446" height="236" rx="6" fill="#11151b" stroke="#232a35" stroke-width="1.2"/>
  <rect x="506" y="358" width="4" height="16" rx="2" fill="#38bdf8"/>
  <text x="520" y="371" fill="#e8edf2" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600">CH2 · D1 + 4-Ch Pattern (D2–D5)</text>
  <text x="506" y="406" fill="#b8c1cc" font-family="IBM Plex Mono, monospace" font-size="12">Wave: Square · Freq: 1000 Hz · Phase: 90°</text>
  <!-- 4-ch pattern preview -->
  <text x="506" y="444" fill="#4ade80" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600">D2–D5 DIGITAL PATTERN (16 STEPS)</text>
  <g transform="translate(506, 458)">
    <rect x="0" y="0" width="36" height="22" rx="3" fill="rgba(74,222,128,0.22)" stroke="#4ade80"/><text x="18" y="15" text-anchor="middle" fill="#dcfce7" font-family="IBM Plex Mono, monospace" font-size="11">1</text>
    <rect x="42" y="0" width="36" height="22" rx="3" fill="#0b0e12" stroke="#232a35"/><text x="60" y="15" text-anchor="middle" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">0</text>
    <rect x="84" y="0" width="36" height="22" rx="3" fill="rgba(74,222,128,0.22)" stroke="#4ade80"/><text x="102" y="15" text-anchor="middle" fill="#dcfce7" font-family="IBM Plex Mono, monospace" font-size="11">1</text>
    <rect x="126" y="0" width="36" height="22" rx="3" fill="#0b0e12" stroke="#232a35"/><text x="144" y="15" text-anchor="middle" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">0</text>
    <rect x="168" y="0" width="36" height="22" rx="3" fill="rgba(74,222,128,0.22)" stroke="#4ade80"/><text x="186" y="15" text-anchor="middle" fill="#dcfce7" font-family="IBM Plex Mono, monospace" font-size="11">1</text>
    <rect x="210" y="0" width="36" height="22" rx="3" fill="rgba(74,222,128,0.22)" stroke="#4ade80"/><text x="228" y="15" text-anchor="middle" fill="#dcfce7" font-family="IBM Plex Mono, monospace" font-size="11">1</text>
    <rect x="252" y="0" width="36" height="22" rx="3" fill="#0b0e12" stroke="#232a35"/><text x="270" y="15" text-anchor="middle" fill="#7d8796" font-family="IBM Plex Mono, monospace" font-size="11">0</text>
    <rect x="294" y="0" width="36" height="22" rx="3" fill="rgba(74,222,128,0.22)" stroke="#4ade80"/><text x="312" y="15" text-anchor="middle" fill="#dcfce7" font-family="IBM Plex Mono, monospace" font-size="11">1</text>
  </g>
</svg>
